<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HugMesh User (remote)</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Dev-shell polish: this document is the standalone `ng serve user` shell
       (in production the hugmesh.net host supplies the brand chrome). The
       canonical HugMesh favicon.ico (multi-resolution, from the host) is
       shipped so a direct hit isn't an unbranded browser-default tab icon.
       Relative path — the base href is '/', so this resolves to /favicon.ico. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="description" content="HugMesh self-service: manage your profile, federation cards, blocks, notifications and preferences." />
  <!-- Runtime theme (fleet 50-hug-theme.sh mechanism): RELATIVE href so it
       resolves under this app's mount behind the gateway; the file's
       :root:root block out-specifies the compiled :root fallbacks regardless
       of stylesheet order. Empty when unthemed (zero-byte 200, no 404). -->
  <link rel="stylesheet" href="hug-theme.css">
</head>
<body>
  <hug-user-root></hug-user-root>
</body>
</html>
