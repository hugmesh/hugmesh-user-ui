# Per-response CSP nonce source. nginx has no built-in random function, so we
# reuse $request_id (a unique 32-hex-char token generated fresh for EVERY
# request): unguessable and different per response, which is exactly what a
# nonce needs to be. The `map` exposes it as $cspnonce so the sub_filter rewrite
# and the Content-Security-Policy header below always emit the SAME value.
#
# Defined at http scope, which is legal here because the Dockerfile installs
# this file as `/etc/nginx/conf.d/default.conf` (`COPY nginx.conf
# /etc/nginx/conf.d/default.conf`) — conf.d/* is `include`d from INSIDE the http
# block of the stock nginx.conf, so a bare `map` + `server` at file top is
# correct. If this ever becomes a wholesale replacement for /etc/nginx/nginx.conf
# it would need an enclosing `events {} http { … }`.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + OAuth
    # redirect flows. Emitted with `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY (consistent with the
    #     CSP frame-ancestors 'none' below) — this remote is loaded by the host
    #     shell via <script> (native federation), NOT via <iframe>, so no framing
    #     of this app is ever required.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.net host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # ── Content-Security-Policy (strong, nonce-based XSS backstop) ────────────
    # WHY THIS EXISTS AT ALL: the TLS front door (hugmesh-gateway SecurityConfig)
    # applies a blanket fallback CSP — `default-src 'self'; script-src 'self'; …`
    # — to any upstream that sends NO CSP of its own. Angular native-federation
    # ships an INLINE `<script type="esms-options">` in index.html and loads the
    # bundle as `type="module-shim"`; under a bare `script-src 'self'` that inline
    # script is blocked, es-module-shims is never configured, the module-shim
    # bundle never runs and Angular NEVER BOOTSTRAPS — <hug-user-root> stays
    # empty and the page renders blank with no server error. Sending our own
    # nonce'd policy here wins over the gateway fallback and fixes that.
    #
    # There is NO 'unsafe-inline' / 'unsafe-hashes' in script-src — only the
    # per-response nonce. The sub_filter below rewrites every '<script' in
    # index.html to carry nonce="$cspnonce", and es-module-shims (2.8.1)
    # auto-propagates that nonce to the module scripts it injects, so native
    # federation keeps working. ('unsafe-inline' would in any case be IGNORED by
    # browsers once a nonce is present.)
    #
    # Directives are TUNED to what this UI's source actually does — the user
    # profile console (home guide, profile + avatar, federation cards editor,
    # self-blocks/self-silence, notifications, preferences, connected apps):
    #   - default-src 'self'                        : same-origin default for
    #                                                 everything not named below,
    #                                                 incl. the frame-src fallback
    #                                                 (the ONE <iframe> this app
    #                                                 renders is the card-preview
    #                                                 `sandbox="" [srcdoc]` frame
    #                                                 in card-editor.component.html
    #                                                 — a null-origin, script-
    #                                                 disabled document that is
    #                                                 never fetched over the
    #                                                 network, so no frame-src
    #                                                 grant is needed; it INHERITS
    #                                                 this policy, which is why the
    #                                                 style/img/font grants below
    #                                                 must also cover the preview).
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only nonce'd same-origin
    #                                                 scripts run; blob: is for the
    #                                                 module URLs es-module-shims
    #                                                 mints while shimming imports.
    #                                                 NO 'wasm-unsafe-eval': this
    #                                                 UI ships no WebAssembly
    #                                                 (no WebAssembly/.wasm
    #                                                 reference anywhere in src/,
    #                                                 and deps are Angular 22 +
    #                                                 CDK + rxjs + zone.js +
    #                                                 katex only).
    #   - style-src 'self' 'unsafe-inline'          : REQUIRED — Angular injects
    #                                                 component styles as runtime
    #                                                 <style> elements, which are
    #                                                 not nonce-able; the sandboxed
    #                                                 card preview also inlines
    #                                                 KATEX_CSS + the author's
    #                                                 .card-root-scoped CSS as a
    #                                                 <style> block. (No blob:
    #                                                 stylesheet is ever created —
    #                                                 there is no createObjectURL
    #                                                 in this codebase.)
    #   - img-src 'self' data: https:               : 'self' for the server-stored
    #                                                 avatar (a same-origin
    #                                                 /bff/user/profile/avatar
    #                                                 URL); data: for the local
    #                                                 FileReader.readAsDataURL
    #                                                 avatar preview
    #                                                 (profile-avatar.component.ts);
    #                                                 https: for card-author <img>
    #                                                 in the preview — the card
    #                                                 sanitiser admits https: and
    #                                                 data:image/* on src and drops
    #                                                 everything else.
    #   - font-src 'self' data:                     : the KaTeX maths webfonts are
    #                                                 shipped INLINE as
    #                                                 data:font/woff2 @font-face
    #                                                 srcs (src/app/katex-css.ts)
    #                                                 and render inside the
    #                                                 preview frame; the app itself
    #                                                 uses system fonts
    #                                                 (styles/_tokens.scss).
    #   - connect-src 'self'                        : every XHR is same-origin —
    #                                                 the generated API client's
    #                                                 rootUrl defaults to '' and
    #                                                 all traffic is /bff/user/**
    #                                                 (+ /bff/owncast/user/**) via
    #                                                 the cookie-bearing
    #                                                 auth.interceptor. The live
    #                                                 notification feed is SSE over
    #                                                 same-origin fetch +
    #                                                 ReadableStream
    #                                                 (notifications.service.ts),
    #                                                 NOT EventSource and NOT a
    #                                                 WebSocket, so no wss: is
    #                                                 granted. initFederation()
    #                                                 fetches its
    #                                                 federation.manifest.json
    #                                                 from this same origin.
    #   - worker-src 'self'                         : this UI creates NO workers
    #                                                 (no `new Worker`, no
    #                                                 SharedWorker, no
    #                                                 serviceWorker registration,
    #                                                 no @angular/service-worker
    #                                                 dep). Stated explicitly so it
    #                                                 does NOT inherit script-src's
    #                                                 blob: via the fetch-directive
    #                                                 fallback chain.
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : no framing (mirrors XFO DENY).
    # DELIBERATELY ABSENT: media-src. Unlike matrix-ui this console plays nothing —
    # there is no <video>/<audio>/HLS player in src/. The <sd-owncast-player> card
    # tag is LOWERED by card-sanitize.ts to an inert
    # `<div class="sd-owncast-player" data-hls-src="…">` notice/placeholder (the
    # sandbox has no allow-scripts, so nothing ever hydrates it here), and
    # owncast.service.ts only reads the caller's grant status over /bff. Granting
    # media-src would widen the policy for a capability this UI does not use.
    #
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # RENAME PHASE 1 — the SAME file under the NEW name. The entrypoint hook
    # writes both spellings byte-for-byte (see docker-entrypoint.d/50-snap-theme.sh),
    # so an index.html from either era resolves and neither URL can 404 while the
    # fleet-wide SNAP_* -> HUG_* rename is in flight. Directives mirror the block
    # above exactly — same no-store, same re-emitted security headers.
    location = /hug-theme.css {
        alias /tmp/hug-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has multiple <script> tags (the
        #                           esms-options inline block, zone.js/
        #                           es-module-shims polyfills, the module-shim
        #                           bootstrap) — rewrite ALL of them, not just the
        #                           first.
        #   - sub_filter_types text/html : ONLY rewrite HTML; JS/CSS bundles are
        #                                  left byte-for-byte untouched (a bundle
        #                                  can legitimately contain the literal
        #                                  string "<script").
        # Do NOT enable gzip_static / precompressed index.html — sub_filter cannot
        # rewrite an already-compressed response body, which would ship un-nonced
        # <script> tags under this CSP and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Type text/plain;
    }
}
